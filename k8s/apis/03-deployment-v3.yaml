apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v3
  namespace: mysql-ns
  labels:
    app: api
    version: v3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
      version: v3
  template:
    metadata:
      labels:
        app: api
        version: v3
    spec:
      containers:
        - name: api
          image: api-v3:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "mysql-0.mysql-service.mysql-ns.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: mysql-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: mysql-database
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
